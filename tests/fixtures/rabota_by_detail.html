    "description": "<p><strong>Работа только в офисе в Минске. Удалённо и с переездом из другой страны не рассматриваем.</strong></p> <p>Я основатель небольшой IT-компании. У нас своя платформа: она принимает запросы от клиентов, за несколько секунд выбирает, у какого поставщика купить, и отдаёт результат. Сотни запросов в секунду, круглые сутки.</p> <p>Код мы почти не пишем руками. За последние полгода в репозитории больше двух тысяч коммитов, и большую часть сделали агенты, в основном Claude Code. Человек ставит задачу, следит, что агент понял её правильно, читает дифф, гоняет проверки и отвечает за то, что уехало в прод.</p> <p>Вокруг агентов у нас свой харнес, и мы его постоянно дорабатываем.</p> <p>Мне нужен ещё один человек, который будет так работать.</p> <p><strong>Что делать</strong></p> <p>Брать задачи и доводить их до прода. Задач много, и они разные. Сегодня логика выбора поставщика, завтра интеграция с чужим API, потом экран в админке, медленный запрос в базе или алерт, который сработал ночью.</p> <p>Читать то, что написал агент. Это главное умение в этой работе. Агент пишет быстро и уверенно, в том числе когда ошибается.</p> <p>Улучшать харнес. Заметил, что агент третий раз наступает на одно и то же, добавил правило или проверку, чтобы четвёртого раза не было.</p> <p>Сейчас основной проект на Python. Дальше появятся другие проекты, возможно на другом стеке. Я хочу, чтобы ты за это время вырос и какой-то из них вёл уже сам.</p> <p><strong>На чём всё написано</strong></p> <p>Python 3.13, FastAPI, asyncio. MySQL, RabbitMQ, Redis. Админка на React и TypeScript (Mantine, TanStack Query, Vite). Прод на обычных серверах: systemd, nginx, Prometheus и Grafana. GitLab.</p> <p>Знать всё это заранее не надо. Python нужен уверенный, остальное подтянешь по ходу.</p> <p><strong>Кого ищу</strong></p> <p>Большой опыт мне не нужен. Год-два работы или свои проекты, которые ты довёл до рабочего состояния, меня устроят одинаково.</p> <p>Ты понимаешь принципы DDD. Зачем отделять домен от инфраструктуры, что такое агрегат, почему слова из бизнеса должны совпадать с именами в коде. Цитировать Эванса не прошу, мне хватит того, что ты видишь, когда сущность размазана по пяти файлам, и тебя это раздражает.</p> <p>Ты пишешь чистый код и знаешь, что за этими словами стоит: Clean Code, SOLID, чистая архитектура. Маленькие модули с одной ответственностью, понятные имена, зависимости в одну сторону, тест на каждое поведение. Рефакторинг для тебя обычная часть работы. Агент охотно напишет файл на тысячу строк, если его не остановить, и останавливать его будешь ты.</p> <p>Из остального нужны SQL на уровне «прочитать план запроса и понять, почему медленно», асинхронный код, git и привычка смотреть в логи раньше, чем строить догадки.</p> <p>Ты уже работал с агентами всерьёз. Claude Code, Cursor, Codex, что угодно. Настраивал под себя правила, хуки, скиллы, субагентов, и понимаешь, зачем агенту ограничения.</p> <p>Тебе нравится, когда задач много. Закрыл одну, взял следующую, и от этого хорошо.</p> <p>Много говорить не обязательно. Созвонов у нас почти нет, общаемся в телеграме, коротко. Сделал, написал «готово, вот что проверил», пошёл дальше. Меня это полностью устраивает.</p> <p>Тебе интересно расти. Через год я хочу давать тебе задачи, которые сегодня дать не могу.</p> <p>Одно правило. Если застрял или что-то сломал, пиши сразу. Починим. Плохо будет только тогда, когда дело стоит, а я узнаю об этом через неделю.</p> <p><strong>Кому здесь будет плохо</strong></p> <p>Если ты считаешь, что настоящий код пишется только руками, а агенты это игрушка. И если тебе нужны спринты, груминг и тимлид, который разложит задачу по шагам. У нас этого нет.</p> <p><strong>Условия</strong></p> <p>Полный день, 5/2, в офисе в Минске. Удалёнки нет: мы сидим рядом, и так быстрее. Трудовой договор, испытательный срок три месяца, договор о неразглашении. Подписки на ИИ-инструменты оплачиваем мы. Зарплата от 4 000 Br на руки, после испытательного срока пересматриваем по результату.</p> <p><strong>Как откликнуться</strong></p> <p>Развёрнутое резюме не нужно. Напиши, что ты закончил или где сейчас учишься. Пришли ссылку на свой GitHub или GitLab. Если репозитории закрытые, покажи что-нибудь, что ты сделал сам: бот, сервис, сайт, любую работающую штуку. Отклики без этого я не смотрю.</p> <p>И напиши пару предложений о том, как у тебя устроена работа с агентами и что ты в ней последним поменял.</p>",
